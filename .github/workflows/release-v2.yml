name: Release v2.0.0

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/release-v2.yml"
      - "tools/build_icon.py"
      - "GistApp.py"
      - "gist_manager/**"
      - "assets/**"
      - "requirements.txt"

permissions:
  contents: write

jobs:
  windows-release:
    if: github.repository == 'Swir/Gist_manager'
    runs-on: windows-latest
    env:
      TAG: v2.0.0
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check whether v2.0.0 already exists
        id: release_check
        shell: pwsh
        run: |
          gh release view $env:TAG --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            "exists=true" >> $env:GITHUB_OUTPUT
            Write-Host "Release $env:TAG already exists; publication will be skipped."
          } else {
            "exists=false" >> $env:GITHUB_OUTPUT
            Write-Host "Release $env:TAG does not exist; continuing."
          }
          exit 0

      - name: Install build dependencies
        if: steps.release_check.outputs.exists != 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pillow

      - name: Validate Python sources
        if: steps.release_check.outputs.exists != 'true'
        run: python -m compileall -q GistApp.py gist_manager tools

      - name: Generate Windows icon
        if: steps.release_check.outputs.exists != 'true'
        run: python tools/build_icon.py

      - name: Build one-file Windows EXE
        if: steps.release_check.outputs.exists != 'true'
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed `
            --name GistManager `
            --icon build/gist-manager.ico `
            --add-data "assets/gist-manager.svg;assets" `
            GistApp.py
          if (-not (Test-Path "dist/GistManager.exe")) {
            throw "PyInstaller did not produce dist/GistManager.exe"
          }

      - name: Smoke-test packaged EXE
        if: steps.release_check.outputs.exists != 'true'
        shell: pwsh
        run: |
          $process = Start-Process -FilePath ".\dist\GistManager.exe" -PassThru
          Start-Sleep -Seconds 6
          if ($process.HasExited) {
            throw "GistManager.exe exited during startup smoke test with code $($process.ExitCode)."
          }
          Stop-Process -Id $process.Id -Force
          Write-Host "Packaged EXE startup smoke test passed."

      - name: Package release files and checksums
        if: steps.release_check.outputs.exists != 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item "dist/GistManager.exe" "release/GistManager.exe"
          Compress-Archive -Path "release/GistManager.exe", "README.md" -DestinationPath "release/GistManager-v2.0.0-Windows.zip" -Force

          $exe = Get-FileHash "release/GistManager.exe" -Algorithm SHA256
          $zip = Get-FileHash "release/GistManager-v2.0.0-Windows.zip" -Algorithm SHA256
          @(
            "$($exe.Hash.ToLower())  GistManager.exe"
            "$($zip.Hash.ToLower())  GistManager-v2.0.0-Windows.zip"
          ) | Set-Content -Encoding ascii "release/SHA256SUMS.txt"

          @"
          # Gist Manager v2.0.0

          Major Windows desktop refresh of Gist Manager by Swir.

          ## Highlights
          - redesigned Midnight Blue card-based interface
          - Graphite and Light themes
          - drag-and-drop file/folder Gist creation
          - live Gist search and improved sortable manager table
          - copy/open context actions and clearer progress feedback
          - safer hidden GitHub token input and API timeouts
          - original Gist Manager application icon
          - Windows one-file EXE: no Python installation required

          ## Downloads
          - `GistManager.exe` — standalone Windows application
          - `GistManager-v2.0.0-Windows.zip` — portable ZIP package
          - `SHA256SUMS.txt` — integrity checksums

          The Windows executable is built automatically on GitHub Actions and must pass a packaged startup smoke test before this Release is created.
          "@ | Set-Content -Encoding utf8 "release/RELEASE_NOTES.md"

      - name: Upload verified Windows build artifact
        if: steps.release_check.outputs.exists != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: GistManager-v2.0.0-Windows
          path: |
            release/GistManager.exe
            release/GistManager-v2.0.0-Windows.zip
            release/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish GitHub Release v2.0.0
        if: steps.release_check.outputs.exists != 'true'
        shell: pwsh
        run: |
          gh release create $env:TAG `
            "release/GistManager.exe#GistManager.exe" `
            "release/GistManager-v2.0.0-Windows.zip#GistManager-v2.0.0-Windows.zip" `
            "release/SHA256SUMS.txt#SHA256SUMS.txt" `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:GITHUB_SHA `
            --title "Gist Manager v2.0.0" `
            --notes-file "release/RELEASE_NOTES.md"
